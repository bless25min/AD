<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <rect width="100%" height="100%" fill="#1e3a8a" />
  <g stroke-width="1.5" fill="none">
    <!-- Network / Circuit lines -->
    <path stroke="#eab308" stroke-opacity="0.6" d="M0,50 L50,50 L80,20 L150,20 L180,50 L400,50" />
    <path stroke="#eab308" stroke-opacity="0.4" d="M50,400 L50,350 L80,320 L150,320 L180,350 L200,350 L250,300 M250,300 L250,0" />
    <path stroke="#f8fafc" stroke-opacity="0.3" d="M0,150 L100,150 L150,200 L300,200 L350,150 L400,150" />
    <path stroke="#f8fafc" stroke-opacity="0.2" d="M200,400 L200,280 L230,250 L350,250 M350,250 L350,280" />
    <path stroke="#eab308" stroke-opacity="0.5" d="M300,0 L300,80 L270,110 L150,110 L120,80 L80,80" />
    <path stroke="#f8fafc" stroke-opacity="0.4" d="M100,400 L100,250 L120,230 L0,230" />
    
    <!-- Nodes (Gold) -->
    <circle cx="50" cy="50" r="3" fill="#eab308" stroke="none" />
    <circle cx="150" cy="20" r="3" fill="#eab308" stroke="none" />
    <circle cx="180" cy="50" r="3" fill="#eab308" stroke="none" />
    <circle cx="250" cy="300" r="3" fill="#eab308" stroke="none" />
    <circle cx="80" cy="80" r="3" fill="#eab308" stroke="none" />
    <circle cx="270" cy="110" r="3" fill="#eab308" stroke="none" />
    <circle cx="300" cy="80" r="3" fill="#eab308" stroke="none" />
    
    <!-- Nodes (White) -->
    <circle cx="100" cy="150" r="2.5" fill="#f8fafc" stroke="none" />
    <circle cx="150" cy="200" r="2.5" fill="#f8fafc" stroke="none" />
    <circle cx="300" cy="200" r="2.5" fill="#f8fafc" stroke="none" />
    <circle cx="350" cy="150" r="2.5" fill="#f8fafc" stroke="none" />
    <circle cx="200" cy="280" r="2.5" fill="#f8fafc" stroke="none" />
    <circle cx="350" cy="250" r="2.5" fill="#f8fafc" stroke="none" />
    <circle cx="350" cy="280" r="2.5" fill="#f8fafc" stroke="none" />
    <circle cx="100" cy="250" r="2.5" fill="#f8fafc" stroke="none" />
    
